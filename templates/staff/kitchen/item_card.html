<article class="kitchen-ticket"><div class="d-flex justify-content-between"><strong>Bàn {{ item.order.table.code }}</strong><small>{{ item.sent_at|date:'H:i' }}</small></div><h3>{{ item.quantity }} × {{ item.dish_name }}</h3><p>{{ item.note|default:'Không ghi chú' }}</p>{% if target %}<form method="post" action="{% url 'kitchen:transition' item.pk target %}">{% csrf_token %}<button class="btn btn-primary w-100">{{ button }}</button></form>{% else %}<span class="badge text-bg-success">Chờ phục vụ nhận món</span>{% endif %}</article>
