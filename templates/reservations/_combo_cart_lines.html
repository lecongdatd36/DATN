{% load i18n customer_language %}
{% for row in form.combo_rows %}<article class="or-cart-item" data-cart-item="combo-{{ row.combo.pk }}" hidden>
<div class="or-cart-item-top"><strong>{{ row.combo|public_name }}</strong><button type="button" class="or-remove" data-remove="combo-{{ row.combo.pk }}" aria-label="{% translate "Xóa" %} {{ row.combo|public_name }} {% translate "khỏi giỏ" %}">{% translate "Xóa" %}</button></div><div class="or-cart-item-bottom"><div class="or-cart-quantity"><button type="button" data-quantity-delta="-1" data-target="combo-{{ row.combo.pk }}" aria-label="{% translate "Bớt" %} {{ row.combo|public_name }}">−</button><span data-item-count>0</span><button type="button" data-quantity-delta="1" data-target="combo-{{ row.combo.pk }}" aria-label="{% translate "Thêm" %} {{ row.combo|public_name }}" {% if not row.combo.is_orderable or mode == 'READY' and not row.advance_allowed %}disabled{% endif %}>+</button></div><strong data-line-total>{% translate "0đ" %}</strong></div><label class="or-sr-only" for="{{ row.note.id_for_label }}">{% translate "Ghi chú combo" %}</label>{{ row.note }}{{ row.note.errors }}</article>{% endfor %}
