{% if page_obj.has_other_pages %}<nav class="d-flex gap-3 align-items-center p-2" aria-label="Phân trang">{% if page_obj.has_previous %}<a href="?{{ query_string }}&page={{ page_obj.previous_page_number }}">Trang trước</a>{% endif %}<span>{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a href="?{{ query_string }}&page={{ page_obj.next_page_number }}">Trang sau</a>{% endif %}</nav>{% endif %}
