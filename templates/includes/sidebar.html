<div class="px-3 py-4">
    <p class="eyebrow px-3 mb-3">KHÔNG GIAN LÀM VIỆC</p>
    <nav class="nav flex-column gap-1 sidebar-nav" aria-label="Chức năng tài khoản">
        <a class="nav-link {% if request.resolver_match.url_name == 'workspace' %}active{% endif %}" href="{% url 'accounts:workspace' %}" {% if request.resolver_match.url_name == 'workspace' %}aria-current="page"{% endif %}>Tài khoản của tôi</a>
        <a class="nav-link {% if request.resolver_match.url_name == 'password_change' or request.resolver_match.url_name == 'password_change_done' %}active{% endif %}" href="{% url 'accounts:password_change' %}" {% if request.resolver_match.url_name == 'password_change' or request.resolver_match.url_name == 'password_change_done' %}aria-current="page"{% endif %}>Đổi mật khẩu</a>
        {% if access.can_manage_accounts %}
        <span class="eyebrow px-3 mt-4 mb-2">QUẢN LÝ</span>
        <a class="nav-link {% if request.resolver_match.url_name == 'account_list' or request.resolver_match.url_name == 'account_lock' or request.resolver_match.url_name == 'account_unlock' or request.resolver_match.url_name == 'password_reset' %}active{% endif %}" href="{% url 'accounts:account_list' %}">Tài khoản</a>
        {% endif %}
        {% if access.can_access_admin %}
        <span class="eyebrow px-3 mt-4 mb-2">HỆ THỐNG</span>
        <a class="nav-link" href="{% url 'admin:index' %}">Quản trị hệ thống</a>
        {% endif %}
    </nav>
</div>
