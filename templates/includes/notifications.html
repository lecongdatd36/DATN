<div class="dropdown notification-dropdown">
    <button class="icon-button notification-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Thông báo công việc đang chờ" title="Thông báo">
        <svg class="app-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
        {% include 'includes/notification_badge.html' with key='total' count=nav_notifications.counts.total %}
    </button>
    <div class="dropdown-menu dropdown-menu-end notification-menu">
        <strong class="notification-heading">Thông báo <span data-notification-total>{{ nav_notifications.counts.total }}</span></strong>
        <p class="notification-empty" data-notification-empty {% if nav_notifications.counts.total %}hidden{% endif %}>Không có việc đang chờ.</p>
        {% for entry in nav_notifications.entries %}
        <a class="dropdown-item notification-entry" href="{{ entry.url }}" data-notification-entry="{{ entry.key }}" {% if not entry.count %}hidden{% endif %}><span>{{ entry.label }}</span>{% include 'includes/notification_badge.html' with key=entry.key count=entry.count %}</a>
        {% endfor %}
    </div>
</div>
