{% extends 'base.html' %}
{% block title %}Đổi mật khẩu · QLNH{% endblock %}
{% block content %}
<section class="container-fluid px-3 px-md-4 pb-5">
    <p class="eyebrow mb-2">BẢO MẬT TÀI KHOẢN</p>
    <h1 class="h2 mb-2">Đổi mật khẩu</h1>
    <p class="text-secondary mb-4">Nhập mật khẩu hiện tại để xác nhận trước khi đặt mật khẩu mới.</p>
    <div class="project-card form-card p-4 p-md-5">
        <form method="post">
            {% csrf_token %}
            {% include 'includes/form_fields.html' %}
            <div class="d-flex flex-wrap gap-2">
                <button class="btn btn-primary" type="submit">Lưu mật khẩu mới</button>
                <a class="btn btn-outline-secondary" href="{% url 'accounts:workspace' %}">Hủy</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
