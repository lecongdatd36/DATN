<form method="get" class="project-card p-3 p-md-4 mb-4" novalidate>
    <div class="row g-3">
        {% for field in filter_form %}<div class="col-sm-6 col-xl-3"><label class="form-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>{% endfor %}
    </div>
    <div class="d-flex gap-2 mt-3"><button class="btn btn-primary" type="submit">Tìm kiếm</button><a class="btn btn-outline-secondary" href="{{ request.path }}">Xóa lọc</a></div>
</form>
