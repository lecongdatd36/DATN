<!doctype html><html lang="vi"><meta charset="utf-8"><title>Kiểm tra bản mẫu</title>
<iframe title="Mobile preview" src="index.html" width="390" height="844" style="border:0"></iframe><pre id="result">RUNNING</pre>
<script>
document.querySelector('iframe').addEventListener('load', () => {
  const results=[];
  const doc=document.querySelector('iframe').contentDocument;
  const phones=doc.querySelectorAll('[data-phone]');
  const phone=phones[0];
  const assert=(condition,message)=>{if(!condition)throw new Error(message);results.push('PASS '+message);};
  const click=(selector,root=phone)=>{const element=root.querySelector(selector);if(!element)throw new Error('Missing '+selector);element.click();};
  try {
    assert(phones.length===3,'Three preview screens render');
    assert(phone.scrollWidth<=phone.clientWidth,'390px phone has no horizontal overflow');
    click('[data-code="B01"]');
    assert(Boolean(phone.querySelector('[data-form="open"]')),'Free table opens guest form');
    phone.querySelector('[data-form="open"]').requestSubmit();
    assert(phone.textContent.includes('Gọi món')&&phone.textContent.includes('B01'),'Opening table enters its menu');
    assert(!phone.textContent.includes('Đã chọn 1'),'New table has an independent empty order');
    const search=phone.querySelector('[data-search]');search.value='pho';search.dispatchEvent(new Event('input',{bubbles:true}));
    assert(phone.querySelectorAll('.dish').length===1&&phone.querySelector('.dish h3').textContent==='Phở bò tái','Unaccented menu search works');
    click('[data-action="add"][data-id="2"]');
    click('[data-screen="order"]');
    assert(phone.querySelector('.total strong').textContent==='75.000đ','Adding a dish updates the order total');
    click('[data-action="plus"]');
    assert(phone.querySelector('.total strong').textContent==='150.000đ','Quantity increase recalculates total');
    click('[data-action="minus"]');
    click('[data-action="confirm-send"]');
    assert(!phone.querySelector('.pill.cooking'),'Opening confirmation does not send dishes');
    click('[data-action="close"]');
    assert(Boolean(phone.querySelector('.stepper')),'Cancelling keeps dishes editable');
    click('[data-action="confirm-send"]');click('[data-action="send"]');
    assert(Boolean(phone.querySelector('.pill.cooking'))&&!phone.querySelector('.stepper')&&phone.textContent.includes('Chờ bếp nhận'),'Sent dishes wait for kitchen and cannot be edited');
    click('[data-screen="tables"]');click('[data-screen="requests"]');
    click('[data-action="request"][data-id="1"]');
    assert(phone.querySelectorAll('.request-card').length===3,'Handling service request keeps QR and payment requests');
    click('#reset',doc);
    assert(phone.querySelectorAll('.table-card').length===6,'Reset restores initial table map');
    click('[data-code="B04"]');click('[data-screen="menu"]');click('[data-action="note"][data-id="1"]');
    phone.querySelector('textarea').value='<script>test</'+'script>';
    phone.querySelector('[data-form="note"]').requestSubmit();click('[data-screen="order"]');
    assert(phone.textContent.includes('<script>test</'+'script>')&&!phone.querySelector('.order-item script'),'Notes are displayed as text');
    assert(phone.scrollWidth<=phone.clientWidth,'Order remains within 390px viewport');
    const reset=()=>doc.querySelector('#reset').click();
    const select=(selector,value)=>{const element=doc.querySelector(selector);element.value=value;element.dispatchEvent(new Event('change',{bubbles:true}));};
    const scenario=value=>select('#demo-scenario',value);
    const submit=type=>{const form=phone.querySelector(`[data-form="${type}"]`);if(!form)throw new Error('Missing form '+type);form.requestSubmit();};
    reset();
    click('[data-screen="ready"]');
    assert(phone.textContent.includes('Một tô không hành'),'Ready screen highlights kitchen note');
    click('[data-action="served"]');
    assert(Boolean(phone.querySelector('[data-action="confirm-served"]')),'Serving requires confirmation');
    click('[data-action="confirm-served"]');
    assert(!phone.querySelector('.ready-card'),'Served dish leaves ready queue');
    reset();click('[data-screen="bookings"]');click('[data-action="booking-review"]');
    submit('booking');
    assert(Boolean(phone.querySelector('[data-form="booking"]')),'Booking cannot be seated before identity check');
    phone.querySelector('[name="verified"]').checked=true;submit('booking');
    assert(phone.textContent.includes('B03')&&phone.textContent.includes('5 khách')&&phone.textContent.includes('Gọi món'),'Verified booking opens correct table with guest count');
    reset();click('[data-screen="requests"]');click('[data-action="qr-review"][data-id="12"]');click('[data-action="confirm-qr"]');
    assert(phone.textContent.includes('Chờ bếp nhận')&&phone.querySelectorAll('.stepper').length===2,'QR approval sends only QR dishes and retains manual drafts');
    click('[data-screen="tables"]');click('[data-screen="requests"]');
    assert(!phone.querySelector('[data-action="qr-review"][data-id="12"]'),'Processed QR request cannot be approved twice');
    reset();click('[data-screen="requests"]');click('[data-action="qr-reject"][data-id="12"]');
    phone.querySelector('[name="reason"]').value='   ';submit('reject');
    assert(Boolean(phone.querySelector('.form-error')),'QR rejection refuses whitespace-only reason');
    phone.querySelector('[name="reason"]').value='Món đã hết';submit('reject');
    assert(!phone.querySelector('[data-action="qr-review"][data-id="12"]'),'QR rejection removes pending request');
    reset();click('[data-screen="requests"]');click('[data-action="qr-review"][data-id="11"]');click('[data-action="confirm-qr"]');
    assert(phone.textContent.includes('B05')&&phone.textContent.includes('2 khách'),'QR check-in opens requested free table');
    reset();click('[data-code="B04"]');click('[data-action="table-info"]');click('[data-action="move"]');submit('move');
    assert(phone.textContent.includes('B01')&&phone.querySelector('.total strong').textContent==='234.000đ','Move preserves complete order and amount');
    click('[data-screen="tables"]');
    assert(phone.querySelector('[data-code="B04"]').classList.contains('cleaning'),'Move leaves original table needing cleaning');
    click('[data-code="B04"]');click('[data-action="finish-cleaning"]');
    assert(phone.querySelector('[data-code="B04"]').classList.contains('available'),'Cleaning confirmation returns table to available');
    reset();click('[data-code="B04"]');click('[data-action="cancel-item"][data-index="0"]');
    phone.querySelector('[name="reason"]').value='Khách đổi món';submit('cancel-item');
    assert(phone.querySelector('.total strong').textContent==='145.000đ'&&phone.textContent.includes('Khách đổi món'),'Cancellation retains reason and excludes item from total');
    reset();click('[data-code="B04"]');click('[data-action="cancel-item"][data-index="2"]');
    assert(!phone.querySelector('[data-form="cancel-item"]')&&phone.textContent.includes('Cần người có quyền'),'Service cannot cancel prepared dish');
    select('#demo-role','manager');click('[data-action="cancel-item"][data-index="2"]');
    phone.querySelector('[name="reason"]').value='Sai yêu cầu của khách';submit('cancel-item');
    assert(phone.querySelector('.total strong').textContent==='164.000đ','Manager may cancel prepared dish with reason');
    click('[data-action="table-info"]');click('[data-action="cancel-order"]');
    phone.querySelector('[name="reason"]').value='Khách không tiếp tục dùng bàn';submit('cancel-order');
    assert(phone.textContent.includes('Đã hủy'),'Draft-only order can be cancelled');
    reset();click('[data-code="B04"]');click('[data-action="table-info"]');click('[data-action="cancel-order"]');
    assert(!phone.querySelector('[data-form="cancel-order"]'),'Whole order cancellation blocked after dishes sent');
    reset();click('[data-code="B04"]');
    assert(!phone.querySelector('[data-action="payment"]'),'Payment request unavailable while drafts remain');
    scenario('served');click('[data-action="payment"]');click('[data-action="confirm-payment"]');
    assert(phone.textContent.includes('Chờ thu ngân')&&!phone.querySelector('.stepper'),'Payment request locks order editing');
    click('[data-action="table-info"]');
    assert(!phone.querySelector('[data-action="split"]'),'Service role has no split action');
    select('#demo-role','cashier');click('[data-action="table-info"]');click('[data-action="split"]');
    const qty=phone.querySelector('[name="qty-0"]');qty.value=1;submit('split');
    assert(phone.querySelector('.total strong').textContent==='145.000đ','Cashier split subtracts selected items from root');
    click('[data-action="split"]');
    assert(phone.textContent.includes('89.000đ'),'Split check retains moved item amount');
    click('[data-action="merge"]');click('[data-action="confirm-merge"]');
    assert(phone.querySelector('.total strong').textContent==='234.000đ','Merging restores original amount without duplication');
    click('[data-action="table-info"]');click('[data-action="split"]');
    phone.querySelectorAll('.split-row input').forEach(input=>input.value=input.max);submit('split');
    assert(Boolean(phone.querySelector('.form-error')),'Cannot split every item out of root check');
    reset();click('[data-code="B04"]');click('[data-action="confirm-send"]');scenario('offline');click('[data-action="send"]');
    assert(phone.textContent.includes('Chưa có kết nối mạng'),'Offline send shows actionable error');
    scenario('online');click('[data-action="restore-sheet"]');click('[data-action="close"]');
    assert(phone.querySelectorAll('.stepper').length===2,'Offline send preserves drafts');
    click('[data-action="confirm-send"]');scenario('failure');click('[data-action="send"]');
    assert(phone.textContent.includes('Chưa gửi được thao tác'),'Failed send does not report success');
    click('[data-action="restore-sheet"]');click('[data-action="send"]');
    assert(phone.textContent.includes('Chờ bếp nhận')&&!phone.querySelector('.stepper'),'Retry sends drafts once');
    reset();click('[data-code="B04"]');click('[data-action="confirm-send"]');scenario('conflict');click('[data-action="send"]');
    assert(phone.textContent.includes('Order vừa được cập nhật'),'Stale confirmation is rejected');
    click('[data-action="restore-sheet"]');click('[data-action="close"]');
    assert(phone.querySelectorAll('.stepper').length===2,'Conflict does not send or remove draft items');
    click('[data-screen="menu"]');click('[data-action="note"][data-id="3"]');
    phone.querySelector('textarea').value='Ít ngọt, thêm đá';phone.querySelector('textarea').dispatchEvent(new Event('input',{bubbles:true}));scenario('offline');submit('note');scenario('online');click('[data-action="restore-sheet"]');
    assert(phone.querySelector('textarea').value==='Ít ngọt, thêm đá','Typed note survives offline error and retry');
    reset();
    [320,360,390,430].forEach(width=>{
      document.querySelector('iframe').width=width;
      ['tables','ready','bookings','requests'].forEach(screen=>{
        click(`[data-screen="${screen}"]`);
        assert(phone.scrollWidth<=phone.clientWidth,`${screen} fits ${width}px without horizontal overflow`);
      });
      click('[data-screen="tables"]');click('[data-code="B04"]');
      assert(phone.scrollWidth<=phone.clientWidth,`Order fits ${width}px`);
      click('[data-action="table-info"]');click('[data-action="move"]');
      assert(phone.querySelector('.sheet').scrollWidth<=phone.querySelector('.sheet').clientWidth,`Move sheet fits ${width}px`);
      click('[data-action="close"]');click('[data-screen="tables"]');
    });
    document.querySelector('iframe').width=390;
    reset();
    const typeInto=(selector,value)=>{const element=phone.querySelector(selector);if(!element)throw new Error('Missing input '+selector);element.value=value;element.dispatchEvent(new Event('input',{bubbles:true}));};
    const openFree=()=>{reset();click('[data-code="B01"]');};
    const lookup=value=>{typeInto('[name="customer_phone"]',value);click('[data-action="lookup-customer"]');};
    openFree();
    assert(!phone.querySelector('[data-action="customer-mode"]')&&!phone.querySelector('[name="customer_phone"]').required,'Reception uses optional phone without customer classification');
    const receptionTitle=phone.querySelector('.sheet h3').getBoundingClientRect(),receptionBounds=phone.querySelector('.sheet').getBoundingClientRect();
    assert(receptionTitle.height>0&&receptionTitle.top>=receptionBounds.top,'Reception title remains visible above scrollable fields');
    click('[data-action="lookup-customer"]');
    assert(!phone.querySelector('.form-error'),'Finding with empty optional phone does not block reception');
    lookup('0987654321');
    assert(Boolean(phone.querySelector('[name="customer_name"]')),'Unknown phone reveals registration without classification');
    typeInto('[name="customer_phone"]','');
    assert(!phone.querySelector('[name="customer_name"]')&&!phone.querySelector('.matched-customer'),'Deleting phone removes stale registration fields and required name');
    submit('open');
    assert(phone.querySelector('.guest-context').textContent.includes('Khách vãng lai'),'Anonymous reception does not invent a customer profile');
    openFree();lookup('+84 (90) 123-45.67');
    assert(phone.querySelector('[name="customer_phone"]').value==='0901234567'&&phone.querySelector('.matched-customer').textContent.includes('Trần Thảo'),'Phone lookup normalizes +84 and finds existing profile');
    assert(!phone.querySelector('[name="customer_name"]'),'Existing customer name cannot be overwritten at reception');
    typeInto('[name="visit_note"]','Sinh nhật, có trẻ em');submit('open');
    assert(phone.querySelector('.guest-context').textContent.includes('Trần Thảo')&&phone.querySelector('.guest-context').textContent.includes('0901234567'),'Menu retains linked customer identity');
    click('[data-action="add"][data-id="2"]');click('[data-screen="order"]');
    assert(phone.textContent.includes('Sinh nhật, có trẻ em')&&phone.querySelector('.total strong').textContent==='71.250đ','Order retains visit note and previews membership discount');
    click('[data-action="customer-info"]');
    assert(phone.textContent.includes('KH000001')&&phone.textContent.includes('5%'),'Order exposes full linked customer details');
    click('[data-action="close"]');click('[data-action="table-info"]');click('[data-action="move"]');submit('move');
    assert(phone.querySelector('.guest-context').textContent.includes('Trần Thảo')&&phone.textContent.includes('Sinh nhật, có trẻ em')&&phone.querySelector('.total strong').textContent==='71.250đ','Move preserves identity, visit note and discount');
    openFree();lookup('0123');
    assert(Boolean(phone.querySelector('.form-error'))&&!phone.querySelector('.matched-customer'),'Invalid phone is rejected before lookup selection');
    lookup('0901234567');typeInto('[name="customer_phone"]','0987654321');submit('open');
    assert(Boolean(phone.querySelector('[data-form="open"]'))&&phone.textContent.includes('Tra cứu lại'),'Changing phone invalidates previous customer match');
    click('[data-action="lookup-customer"]');submit('open');
    assert(phone.textContent.includes('Chưa có hồ sơ')&&phone.querySelector('[name="customer_name"]').required,'Unknown phone automatically reveals required registration name');
    lookup('0987654321');typeInto('[name="customer_name"]','   ');submit('open');
    assert(Boolean(phone.querySelector('.form-error')),'New customer requires a nonblank name');
    typeInto('[name="customer_name"]','  Lê   An  ');typeInto('[name="visit_note"]','Bàn yên tĩnh');submit('open');
    assert(phone.querySelector('.guest-context').textContent.includes('Lê An')&&phone.querySelector('.guest-context').textContent.includes('0987654321'),'New customer is created and linked with normalized name');
    click('[data-screen="tables"]');click('[data-code="B05"]');lookup('0987654321');
    assert(phone.querySelector('.matched-customer').textContent.includes('Lê An'),'Created customer is reusable at another reception');
    openFree();lookup('0987654321');typeInto('[name="customer_name"]','Tên không được ghi đè');lookup('0901234567');
    assert(phone.querySelector('.matched-customer').textContent.includes('Trần Thảo')&&!phone.querySelector('[name="customer_name"]'),'Looking up an existing phone removes registration fields without overwriting name');
    click('[data-action="clear-customer"]');submit('open');
    assert(phone.querySelector('.guest-context').textContent.includes('Khách vãng lai'),'Switching to anonymous clears customer association');
    openFree();lookup('0987654321');typeInto('[name="customer_name"]','Khách chưa được tạo');
    doc.querySelector('#demo-add-customer').checked=false;doc.querySelector('#demo-add-customer').dispatchEvent(new Event('change'));submit('open');
    assert(phone.textContent.includes('chưa có quyền thêm khách hàng')&&Boolean(phone.querySelector('[data-form="open"]')),'Customer creation requires its own add_customer capability');
    doc.querySelector('#demo-add-customer').checked=true;doc.querySelector('#demo-add-customer').dispatchEvent(new Event('change'));scenario('failure');submit('open');
    assert(phone.textContent.includes('Chưa gửi được thao tác'),'Failed reception does not report an opened table');
    click('[data-action="restore-sheet"]');click('[data-action="lookup-customer"]');
    assert(!phone.querySelector('.matched-customer')&&phone.querySelector('[name="customer_name"]').value==='Khách chưa được tạo','Failed reception keeps name but does not create an orphan profile');
    scenario('offline');click('[data-action="lookup-customer"]');
    assert(phone.textContent.includes('Chưa có mạng để tra cứu')&&!phone.querySelector('.matched-customer'),'Offline lookup cannot claim a verified match');
    openFree();lookup('0987654321');typeInto('[name="customer_name"]','Tên giữ lại khi lỗi');typeInto('[name="visit_note"]','Có xe đẩy trẻ em');scenario('offline');submit('open');scenario('online');click('[data-action="restore-sheet"]');
    assert(phone.querySelector('[name="customer_name"]').value==='Tên giữ lại khi lỗi'&&phone.querySelector('[name="visit_note"]').value==='Có xe đẩy trẻ em','Failed reception preserves customer fields and visit note');
    reset();click('[data-screen="bookings"]');click('[data-action="booking-review"]');
    assert(phone.querySelector('.matched-customer').textContent.includes('0912344821')&&phone.textContent.includes('Sinh nhật'),'Booking review includes linked identity and reservation note');
    phone.querySelector('[name="verified"]').checked=true;submit('booking');
    assert(phone.querySelector('.guest-context').textContent.includes('Nguyễn Minh'),'Seating reservation retains linked customer');
    click('[data-screen="order"]');
    assert(phone.textContent.includes('Sinh nhật')&&phone.textContent.includes('Khách đặt trước'),'Reservation note and source follow the order');
    reset();click('[data-screen="requests"]');click('[data-action="qr-review"][data-id="11"]');
    assert(phone.textContent.includes('chưa có thông tin hồ sơ'),'QR check-in does not assume customer identity');
    click('[data-action="confirm-qr"]');
    assert(phone.querySelector('.guest-context').textContent.includes('Khách vãng lai'),'Plain QR confirmation opens anonymous order');
    reset();click('[data-screen="requests"]');click('[data-action="qr-review"][data-id="11"]');click('[data-action="qr-customer"]');lookup('0901234567');submit('open');
    assert(phone.querySelector('.guest-context').textContent.includes('Trần Thảo')&&phone.textContent.includes('B05'),'QR-assisted direct reception links explicitly selected customer');
    click('[data-screen="tables"]');click('[data-screen="requests"]');
    assert(!phone.querySelector('[data-action="qr-review"][data-id="11"]'),'QR-assisted reception consumes request once');
    reset();click('[data-screen="requests"]');click('[data-action="qr-review"][data-id="12"]');click('[data-action="confirm-qr"]');
    assert(phone.querySelector('.guest-context').textContent.includes('Lê Hoàng')&&!phone.querySelector('.guest-context').textContent.includes('Trần Thảo'),'QR sender identity does not replace the customer associated with order');
    openFree();lookup('0901234567');submit('open');click('[data-action="add"][data-id="2"]');click('[data-action="add"][data-id="2"]');click('[data-screen="order"]');scenario('served');click('[data-action="payment"]');click('[data-action="confirm-payment"]');select('#demo-role','cashier');click('[data-action="table-info"]');click('[data-action="split"]');
    phone.querySelector('[name="qty-0"]').value=1;submit('split');
    assert(phone.querySelector('.guest-context').textContent.includes('Trần Thảo')&&phone.querySelector('.total strong').textContent==='71.250đ','Split preserves customer and root membership discount');
    click('[data-action="split"]');
    assert(phone.querySelector('.split-check').textContent.includes('71.250đ'),'Split child previews the same membership policy');
    click('[data-action="merge"]');click('[data-action="confirm-merge"]');
    assert(phone.querySelector('.total strong').textContent==='142.500đ'&&phone.querySelector('.guest-context').textContent.includes('Trần Thảo'),'Merge preserves customer and total after member discount');
    reset();
    [320,360,390,430].forEach(width=>{
      document.querySelector('iframe').width=width;
      click('[data-code="B01"]');lookup('0987654321');
      assert(phone.querySelector('.sheet').scrollWidth<=phone.querySelector('.sheet').clientWidth,`Customer reception form fits ${width}px`);
      const submitButton=phone.querySelector('[data-form="open"] .primary').getBoundingClientRect(),bounds=phone.getBoundingClientRect();
      assert(submitButton.bottom<=bounds.bottom&&submitButton.top>=bounds.top,`Reception confirmation remains visible at ${width}px`);
      click('[data-action="close"]');
    });
    document.querySelector('iframe').height=480;
    click('[data-code="B01"]');lookup('0987654321');
    const shortSubmit=phone.querySelector('[data-form="open"] .primary').getBoundingClientRect(),shortBounds=phone.getBoundingClientRect();
    assert(shortSubmit.bottom<=shortBounds.bottom&&shortSubmit.top>=shortBounds.top,'Reception confirmation stays reachable in reduced viewport height');
    click('[data-action="close"]');
    document.querySelector('iframe').width=390;document.querySelector('iframe').height=844;
    reset();
    document.querySelector('#result').textContent=results.join('\n')+'\nALL '+results.length+' CHECKS PASSED';
  }catch(error){document.querySelector('#result').textContent=results.join('\n')+'\nFAIL '+error.message;}
});
</script></html>
