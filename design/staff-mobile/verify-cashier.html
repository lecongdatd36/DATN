<!doctype html><html lang="vi"><meta charset="utf-8"><title>Kiểm tra mobile thu ngân</title>
<iframe title="Cashier preview" src="index.html" width="390" height="844" style="border:0"></iframe><pre id="result">RUNNING</pre>
<script>
document.querySelector('iframe').addEventListener('load',()=>{
  const results=[],doc=document.querySelector('iframe').contentDocument,phone=doc.querySelector('[data-phone="0"]');
  const assert=(condition,message)=>{if(!condition)throw new Error(message);results.push('PASS '+message);};
  const click=(selector,root=phone)=>{const node=root.querySelector(selector);if(!node)throw new Error('Missing '+selector);node.click();};
  const select=(selector,value)=>{const node=doc.querySelector(selector);node.value=value;node.dispatchEvent(new Event('change',{bubbles:true}));};
  const fill=(selector,value)=>{const node=phone.querySelector(selector);if(!node)throw new Error('Missing '+selector);node.value=value;node.dispatchEvent(new Event('input',{bubbles:true}));};
  const reset=()=>click('#reset',doc),cashier=()=>select('#demo-role','cashier'),scenario=value=>select('#demo-scenario',value);
  const submit=()=>{const form=phone.querySelector('[data-form="checkout"]');if(!form)throw new Error('Missing checkout form');form.requestSubmit();};
  const method=value=>{const input=phone.querySelector(`[name="payment_method"][value="${value}"]`);input.checked=true;input.dispatchEvent(new Event('change',{bubbles:true}));};
  const table8=()=>{const area=phone.querySelector('[data-action="area"][data-value="'+ 'Sân vườn' +'"]');if(area)area.click();click('[data-code="B08"]');};
  const start=()=>{reset();cashier();table8();click('[data-action="checkout"]');};
  const cash=amount=>{fill('[name="cash_received"]',String(amount));submit();click('[data-action="confirm-collect"]');};
  try{
    cashier();
    assert(phone.querySelector('.bottom-nav').textContent.includes('Chờ thanh toán')&&phone.querySelector('.bottom-nav').textContent.includes('Hóa đơn'),'Cashier gets payment and invoice navigation');
    click('[data-code="B01"]');phone.querySelector('[data-form="open"]').requestSubmit();
    assert(Boolean(phone.querySelector('[data-action="add"]')),'Cashier can open table and call dishes');
    click('[data-action="add"][data-id="2"]');click('[data-screen="order"]');click('[data-action="confirm-send"]');click('[data-action="send"]');
    assert(phone.textContent.includes('Chờ bếp nhận'),'Cashier can send dishes to kitchen');
    click('[data-screen="tables"]');click('[data-screen="payments"]');
    assert(phone.textContent.includes('Chưa đủ điều kiện')&&phone.textContent.includes('Phở bò tái'),'Payment queue identifies unfinished dishes');
    assert(!phone.querySelector('[data-action="checkout"][data-code="B04"]'),'Unserved order has no collect button');
    start();
    assert(phone.querySelectorAll('[name="payment_method"]').length===2&&!doc.querySelector('[value^="gateway-"]'),'Cashier offers only cash and bank transfer');
    assert(phone.querySelector('.bill .total strong').textContent==='239.000đ','Checkout opens correct table amount');
    fill('[name="cash_received"]','200000');submit();
    assert(!phone.querySelector('[data-action="confirm-collect"]')&&!phone.querySelector('[data-form="checkout"]').checkValidity(),'Insufficient cash cannot proceed');
    fill('[name="cash_received"]','300000');
    assert(phone.querySelector('[data-change]').textContent==='61.000đ','Cash change updates while typing');
    submit();assert(Boolean(phone.querySelector('[data-action="confirm-collect"]')),'Cash collection requires explicit confirmation');
    click('[data-action="close"]');assert(Boolean(phone.querySelector('[data-form="checkout"]')),'Cancelling confirmation leaves payment uncommitted');
    submit();click('[data-action="confirm-collect"]');
    assert(phone.textContent.includes('Thanh toán thành công')&&phone.querySelector('.receipt-paper').textContent.includes('61.000đ'),'Cash receipt records correct amount and change');
    click('[data-screen="tables"]');assert(phone.querySelector('[data-code="B08"]').classList.contains('cleaning'),'Paid final check moves table to cleaning');
    click('[data-screen="invoices"]');assert(phone.querySelectorAll('.invoice-card').length===1,'Completed payment creates one invoice');
    click('[data-action="receipt"]');click('[data-action="print-receipt"]');assert(Boolean(phone.querySelector('[data-action="browser-print"]')),'Receipt supports print preview');
    click('[data-action="close"]');click('[data-screen="payments"]');
    assert(!phone.querySelector('[data-action="checkout"][data-code="B08"]'),'Paid check cannot be collected twice');
    start();method('BANK_TRANSFER');submit();
    assert(!phone.querySelector('[data-action="confirm-collect"]'),'Bank transfer requires funds-received confirmation');
    fill('[name="transaction_code"]','BANK-123');phone.querySelector('[name="received_transfer"]').checked=true;submit();click('[data-action="confirm-collect"]');
    assert(phone.querySelector('.receipt-paper').textContent.includes('BANK-123')&&phone.querySelector('.receipt-paper').textContent.includes('Chuyển khoản'),'Transfer reference and method are snapshotted');
    start();fill('[name="promotion_code"]','WRONG');click('[data-action="apply-promotion"]');
    assert(phone.textContent.includes('Mã giảm giá không hợp lệ')&&phone.querySelector('.total strong').textContent==='239.000đ','Invalid discount code leaves amount unchanged');
    fill('[name="promotion_code"]','giam10');click('[data-action="apply-promotion"]');
    assert(phone.querySelector('.total strong').textContent==='215.100đ','Promotion preview applies percentage discount');
    fill('[name="cash_received"]','300000');cash(300000);
    assert(phone.querySelector('.receipt-paper').textContent.includes('GIAM10')&&phone.querySelector('.receipt-paper').textContent.includes('84.900đ'),'Receipt stores promotion and adjusted change');
    reset();cashier();click('[data-code="B02"]');scenario('served');click('[data-action="checkout"]');
    assert(phone.querySelector('.total strong').textContent==='175.750đ','Cashier sees member discount before payment');
    fill('[name="promotion_code"]','GIAM10');click('[data-action="apply-promotion"]');
    assert(phone.querySelector('.total strong').textContent==='158.175đ','Promotion is calculated after member discount');
    cash(200000);assert(phone.querySelector('.receipt-paper').textContent.includes('41.825đ'),'Change uses total after both discounts');
    click('[data-screen="tables"]');click('[data-code="B01"]');fill('[name="customer_phone"]','0901234567');click('[data-action="lookup-customer"]');
    assert(phone.querySelector('.matched-customer').textContent.includes('6.158.175đ'),'Member spending increases by amount actually paid once');
    start();fill('[name="cash_received"]','300000');submit();scenario('failure');click('[data-action="confirm-collect"]');
    assert(phone.textContent.includes('Chưa gửi được thao tác'),'Failed collection does not report success');
    click('[data-action="restore-sheet"]');assert(phone.querySelector('[name="cash_received"]').value==='300000','Failed collection preserves entered cash');
    submit();click('[data-action="confirm-collect"]');click('[data-screen="invoices"]');
    assert(phone.querySelectorAll('.invoice-card').length===1,'Retry produces exactly one invoice');
    start();fill('[name="cash_received"]','300000');submit();scenario('offline');click('[data-action="confirm-collect"]');
    assert(phone.textContent.includes('Chưa có kết nối mạng'),'Offline collection is blocked');
    scenario('online');click('[data-action="restore-sheet"]');click('[data-screen="tables"]');
    assert(phone.querySelector('[data-code="B08"]').classList.contains('occupied'),'Offline failure does not close table');
    start();fill('[name="cash_received"]','300000');submit();scenario('served');click('[data-action="confirm-collect"]');
    assert(phone.textContent.includes('Order vừa được cập nhật'),'Stale payment confirmation is rejected');
    click('[data-action="restore-sheet"]');submit();click('[data-action="confirm-collect"]');
    assert(phone.textContent.includes('Thanh toán thành công'),'Payment can proceed after explicit review of fresh data');
    start();select('#demo-role','service');
    assert(!phone.querySelector('[data-form="checkout"]')&&phone.textContent.includes('chỉ gửi yêu cầu'),'Revoked payment permission hides checkout');
    reset();cashier();table8();click('[data-action="table-info"]');click('[data-action="split"]');
    assert(Boolean(phone.querySelector('[data-action="prepare-split"]')),'Cashier can prepare eligible open order for splitting');
    click('[data-action="prepare-split"]');phone.querySelector('[name="qty-0"]').value=1;phone.querySelector('[data-form="split"]').requestSubmit();
    click('[data-action="split"]');click('[data-action="checkout"][data-check]');cash(100000);
    assert(phone.querySelector('.receipt-paper').textContent.includes('89.000đ'),'Split child can be paid independently');
    click('[data-screen="tables"]');assert(phone.querySelector('[data-code="B08"]').classList.contains('occupied'),'Paid child does not close unpaid root table');
    table8();click('[data-action="checkout"]');cash(200000);
    click('[data-screen="tables"]');assert(phone.querySelector('[data-code="B08"]').classList.contains('cleaning'),'Last split-group invoice closes table');
    click('[data-screen="invoices"]');assert(phone.querySelectorAll('.invoice-card').length===2,'Split group records two separate invoices');
    reset();cashier();table8();click('[data-action="table-info"]');click('[data-action="split"]');click('[data-action="prepare-split"]');phone.querySelector('[name="qty-0"]').value=1;phone.querySelector('[data-form="split"]').requestSubmit();
    click('[data-action="checkout"]');cash(200000);click('[data-screen="tables"]');
    assert(phone.querySelector('[data-code="B08"]').classList.contains('occupied'),'Paid root preserves unpaid child');
    select('#demo-role','service');table8();
    assert(!phone.querySelector('[data-action="checkout"]')&&!phone.querySelector('[data-action="receipt"]'),'Service cannot collect or open cashier invoice after root is paid');
    select('#demo-role','cashier');click('[data-screen="tables"]');
    table8();click('[data-action="checkout"][data-check]');cash(100000);click('[data-screen="tables"]');
    assert(phone.querySelector('[data-code="B08"]').classList.contains('cleaning'),'Paying child after root closes group without reopening root');
    [320,360,390,430].forEach(width=>{
      document.querySelector('iframe').width=width;start();
      assert(phone.scrollWidth<=phone.clientWidth,`Cashier checkout fits ${width}px`);
      const button=phone.querySelector('.checkout-submit').getBoundingClientRect(),bounds=phone.getBoundingClientRect();
      assert(button.bottom<=bounds.bottom&&button.top>=bounds.top,`Collect button stays visible at ${width}px`);
      method('BANK_TRANSFER');assert(phone.scrollWidth<=phone.clientWidth,`Transfer form fits ${width}px`);
    });
    document.querySelector('iframe').width=390;reset();
    document.querySelector('#result').textContent=results.join('\n')+'\nALL '+results.length+' CHECKS PASSED';
  }catch(error){document.querySelector('#result').textContent=results.join('\n')+'\nFAIL '+error.message;}
});
</script></html>
